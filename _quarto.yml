project:
  type: book
  post-render:
    - python3 scripts/finalize_sitemap.py
  resources:
    - edition.js

lang: ru

filters:
  - filters/seo.lua
  - filters/literary.lua

book:
  site-url: https://www.alexfeigin.com/
  description: "Современная итальянская поэзия в переводах на русский язык Александра Фейгина. Italian poetry translated into Russian by Alexander (Alex) Feigin."
  open-graph:
    locale: ru_RU
  twitter-card: true
  image: images/Gravity-7.jpg
  image-alt: "Gravity — artwork by Alex Cohen"
  navbar: false

  sidebar:
    title: "Переводы с итальянского Александра Фейгина"
    search: false
    style: floating
  title: "Современная Итальянская Поэзия"
  subtitle: "Переводчик и состaвитель: Александр Фейгин"
  chapters:
    - index.qmd
    - Говони.qmd
    - Монтале.qmd
    - Бертолуччи.qmd
    - Капрони.qmd
    - Мениканти.qmd
    - Рабони.qmd
    - Пекора.qmd
    - Лолини.qmd
    - Прете.qmd
    - Порта.qmd
    - Пьерсанти.qmd
    - Милите.qmd
    - Конте.qmd
    - Пизану.qmd
    - Ламарк.qmd
    - Кавалли.qmd
    - Вивиани.qmd
    - Трави.qmd
    - Фьори.qmd
    - Мари.qmd
    - Пустерла.qmd
    - Арминио.qmd
    - Риккарди.qmd
    - Наццаро.qmd
    - Скарпа.qmd
    - Корафильо.qmd
    - Томада.qmd
    - Нове.qmd
    - Каталано.qmd
    - Д'Агостини.qmd
    - Дженти.qmd
    - Эван.qmd
    - Галлони.qmd
    - book.qmd
    
format:
  html:
    canonical-url: true
    include-in-header: includes/seo.html
    theme: cosmo
    css: styles.css
    include-before-body: includes/edition.html
    linestretch: 1.5
    number-sections: false
    anchor-sections: false
    toc: false
    toc-location: right
    toc-title: Содержание
    mainfont: Literata


